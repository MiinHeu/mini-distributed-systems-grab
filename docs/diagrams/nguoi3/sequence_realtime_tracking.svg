<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#111827"/></marker><style>.title{font:700 30px Arial;fill:#111827}.head{fill:#111827}.headtext{font:700 15px Arial;fill:white}.lane{fill:#f8fafc;stroke:#d1d5db}.line{stroke:#9ca3af;stroke-width:2;stroke-dasharray:7 7}.msg{stroke:#111827;stroke-width:2;marker-end:url(#arrow)}.txt{font:14px Arial;fill:#111827}.loop{fill:#ecfdf5;stroke:#10b981;stroke-width:2}.boxtext{font:14px Arial;fill:#065f46}</style></defs>
  <rect width="1200" height="760" fill="white"/><text x="40" y="50" class="title">Sequence - Real-time tracking</text>
  <g transform="translate(60,90)">
    <g><rect class="lane" x="0" y="0" width="170" height="560"/><rect class="head" x="0" y="0" width="170" height="42"/><text class="headtext" x="85" y="27" text-anchor="middle">Khach</text><line class="line" x1="85" y1="42" x2="85" y2="560"/></g>
    <g><rect class="lane" x="220" y="0" width="190" height="560"/><rect class="head" x="220" y="0" width="190" height="42"/><text class="headtext" x="315" y="27" text-anchor="middle">TripTrackingScreen</text><line class="line" x1="315" y1="42" x2="315" y2="560"/></g>
    <g><rect class="lane" x="470" y="0" width="170" height="560"/><rect class="head" x="470" y="0" width="170" height="42"/><text class="headtext" x="555" y="27" text-anchor="middle">TripsGateway</text><line class="line" x1="555" y1="42" x2="555" y2="560"/></g>
    <g><rect class="lane" x="700" y="0" width="190" height="560"/><rect class="head" x="700" y="0" width="190" height="42"/><text class="headtext" x="795" y="27" text-anchor="middle">AcceptTripScreen</text><line class="line" x1="795" y1="42" x2="795" y2="560"/></g>
    <g><rect class="lane" x="940" y="0" width="150" height="560"/><rect class="head" x="940" y="0" width="150" height="42"/><text class="headtext" x="1015" y="27" text-anchor="middle">Tai xe</text><line class="line" x1="1015" y1="42" x2="1015" y2="560"/></g>
    <line class="msg" x1="85" y1="90" x2="315" y2="90"/><text class="txt" x="120" y="80">Mo man hinh tracking</text>
    <line class="msg" x1="315" y1="140" x2="555" y2="140"/><text class="txt" x="350" y="130">trip:join {tripId}</text>
    <line class="msg" x1="1015" y1="200" x2="795" y2="200"/><text class="txt" x="835" y="190">Dang thuc hien chuyen</text>
    <line class="msg" x1="795" y1="250" x2="555" y2="250"/><text class="txt" x="610" y="240">trip:join {tripId}</text>
    <rect class="loop" x="250" y="300" width="700" height="165" rx="10"/><text class="boxtext" x="270" y="325">Loop moi 10 giay</text>
    <line class="msg" x1="795" y1="360" x2="555" y2="360"/><text class="txt" x="585" y="350">driver:location</text>
    <line class="msg" x1="555" y1="410" x2="315" y2="410"/><text class="txt" x="360" y="400">broadcast location</text>
    <line class="msg" x1="315" y1="455" x2="85" y2="455"/><text class="txt" x="120" y="445">Cap nhat marker + ETA</text>
    <line class="msg" x1="1015" y1="525" x2="795" y2="525"/><text class="txt" x="830" y="515">Hoan thanh chuyen</text>
    <line class="msg" x1="795" y1="575" x2="555" y2="575"/><text class="txt" x="600" y="565">PATCH complete</text>
    <line class="msg" x1="555" y1="625" x2="315" y2="625"/><text class="txt" x="360" y="615">trip:status completed</text>
  </g>
</svg>